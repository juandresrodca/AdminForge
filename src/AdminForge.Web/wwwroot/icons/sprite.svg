<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    AdminForge icon sprite. 24x24, stroke-based, currentColor.
    Adding a tool that needs a new icon means adding one <symbol> here and
    referencing its id from ITool.Icon. Keep the stroke weight at 1.75.
  -->
  <defs>
    <style>
      symbol { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <symbol id="anvil" viewBox="0 0 24 24">
    <path d="M3 8h9l3 3h6l-2.5 4.5H8L5 12H3z" />
    <path d="M8 15.5 7 20h10l-1-4.5" />
    <path d="M5 20h14" />
  </symbol>

  <symbol id="search" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="6.5" />
    <path d="m16 16 4.5 4.5" />
  </symbol>

  <symbol id="github" viewBox="0 0 24 24">
    <path d="M9 19c-4.5 1.5-4.5-2.5-6.5-3m13 5v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 6.2-1.5 6.2-6.8a5.3 5.3 0 0 0-1.5-3.7 4.9 4.9 0 0 0-.1-3.7s-1.2-.3-3.9 1.5a13.4 13.4 0 0 0-7 0C5.6 1.1 4.4 1.4 4.4 1.4a4.9 4.9 0 0 0-.1 3.7A5.3 5.3 0 0 0 2.8 8.8c0 5.3 3.2 6.5 6.2 6.8a3.4 3.4 0 0 0-.9 2.6V22" />
  </symbol>

  <symbol id="network" viewBox="0 0 24 24">
    <rect x="8.5" y="2.5" width="7" height="6" rx="1.5" />
    <rect x="2" y="15.5" width="7" height="6" rx="1.5" />
    <rect x="15" y="15.5" width="7" height="6" rx="1.5" />
    <path d="M12 8.5v3.5M5.5 15.5V12h13v3.5" />
  </symbol>

  <symbol id="globe" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" />
    <path d="M3 12h18" />
    <path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z" />
  </symbol>

  <symbol id="shield" viewBox="0 0 24 24">
