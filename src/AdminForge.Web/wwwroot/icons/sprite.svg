    <path d="m3 6.5 9 6 9-6" />
  </symbol>

  <symbol id="windows" viewBox="0 0 24 24">
    <path d="M3.5 6.2 10.5 5v6.3H3.5z" />
    <path d="M12.4 4.7 20.5 3.5v7.8h-8.1z" />
    <path d="M3.5 12.7h7v6.3l-7-1.2z" />
